name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          version: "0.12.4"
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check --select E4,E7,E9,F factorlab tests
      - name: Test
        run: uv run pytest -q
      - name: Build documentation
        run: uv run mkdocs build --strict
      - name: Smoke test pipeline (synthetic)
        run: |
          uv run factorlab run --data-source synthetic --models eq_weight,elastic_net,lightgbm,deep --hpo 0
          uv run factorlab report
          test -s outputs/results/results.json
          test -s outputs/results/report.html

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --tag factorlab-ci:${{ github.sha }} .
      - name: Verify non-root CLI runtime
        run: |
          docker run --rm factorlab-ci:${{ github.sha }} \
            sh -c 'test "$(id -u)" -ne 0 && factorlab --help >/dev/null'
