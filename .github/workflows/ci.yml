name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check --select E4,E7,E9,F factorlab tests
      - name: Test
        run: uv run pytest -q
      - name: Build documentation
        run: uv run mkdocs build --strict
      - name: Smoke test pipeline (synthetic)
        run: |
          uv run factorlab run --data-source synthetic --models eq_weight,lightgbm,deep --hpo 0
          uv run factorlab report
          test -s outputs/results/results.json
          test -s outputs/results/report.html

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
