# ========== A股多因子研究与样本外回测平台 ==========
# A股多因子研究项目主配置（所有可调参数集中在此）

# 数据源选择: akshare | synthetic
# synthetic 用于本机/沙盒不便访问外网时生成模拟数据，便于流水线自检
data:
  source: akshare            # akshare=实盘数据；synthetic=合成数据（兜底）
  start_date: '2018-01-01'   # 训练期起点
  end_date:   '2025-12-31'   # 测试期终点
  benchmark: '000300.SH'     # 基准：沪深 300
  universe: 'all'            # 'all' | 'hs300' | 'zz500' | 'zz1000'
  fallback_synthetic: true   # AkShare 失败时是否静默降级到 synthetic
  cache_dir: 'data/raw'
  processed_dir: 'data/processed'
  factor_dir: 'data/factors'

# 因子工程
factors:
  standardize: 'zscore'      # zscore | rank
  winsorize: 0.01            # 1%/99% 分位缩尾
  industry_neutral: true     # 行业中性化（行业内 zscore）
  st_filter: true            # 过滤 ST/*ST
  suspended_filter: true     # 过滤停牌

  # 财报可得日期偏移：默认 T+90d 视为财报可用，
  # 关键！严格防止未来信息泄漏
  financial_lag_days: 90

# 样本外回测切分
backtest:
  oos_window: 'quarterly'    # quarterly | monthly | yearly
  train_min_years: 2         # 初始训练窗口（年）
  step_years: 1              # 扩展步长（年）
  test_years: 1              # 测试窗口（年）

# 模型
models:
  cross_section:             # 横截面回归
    enabled: true
    method: 'ols'            # ols | wls
  sort_portfolio:            # 分组组合
    enabled: true
    n_groups: 5
    weighting: 'equal'       # equal | cap_weight
  elastic_net:               # Elastic Net
    enabled: true
    alpha_grid: [0.001, 0.01, 0.05, 0.1]
    l1_ratio_grid: [0.1, 0.3, 0.5, 0.7]
  lightgbm:                  # LightGBM
    enabled: true
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    reg_alpha: 0.1
    reg_lambda: 0.1

# 评估
evaluation:
  ic_methods: ['pearson', 'spearman']    # 计算 IC 与 RankIC
  deciles: 5
  cost_scenarios_bps: [0, 10, 20, 30]    # 单边交易成本（基点）
  robustness:
    by_cap: true          # 按市值分桶
    by_industry: true     # 按行业分桶
    by_regime: true       # 按市场阶段（牛/熊）
  regime:
    bull_threshold: 0.20  # 中证全指 12 月滚动涨幅 > 20% 视为牛市

# 输出
output:
  log_dir: 'outputs/logs'
  result_dir: 'outputs/results'
  figure_dir: 'outputs/figures'
  save_format: ['parquet', 'csv']

# 随机种子
random_seed: 42

# 可视化
visualization:
  style: 'seaborn-v0_8-whitegrid'
  palette: 'Set2'
  fig_dir: 'outputs/figures'
