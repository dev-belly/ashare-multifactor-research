# ========== A股多因子研究与样本外回测平台 ==========
# A股多因子研究项目主配置（所有可调参数集中在此）

# 数据源选择: akshare | synthetic
# synthetic 用于本机/沙盒不便访问外网时生成模拟数据，便于流水线自检
data:
  source: synthetic          # 默认只跑可复现演示数据；akshare 见文档的实验模式
  start_date: '2018-01-01'   # 训练期起点
  end_date:   '2025-12-31'   # 测试期终点
  benchmark: '000300.SH'     # 基准：沪深 300
  universe: 'all'            # 'all' | 'hs300' | 'zz500' | 'zz1000'
  max_symbols: 50            # AkShare 显式加载上限；null 表示不限制
  allow_fallback: false      # 不静默换数据源；true 时会在结果 metadata 记录原因
  allow_partial_real_data: false  # AkShare 财务字段未标准化前，默认拒绝不完整实数运行
  cache_dir: 'data/raw'
  processed_dir: 'data/processed'
  factor_dir: 'data/factors'

# 因子工程
factors:
  standardize: 'zscore'      # zscore | rank
  winsorize: 0.01            # 1%/99% 分位缩尾
  industry_neutral: true     # 行业中性化（行业内 zscore）
  st_filter: true            # 过滤 ST/*ST
  suspended_filter: true     # 过滤停牌

  # 财报实际可得日 = publish_date + 90d（保守安全缓冲）
  financial_lag_days: 90

# 样本外回测切分
backtest:
  oos_window: 'yearly'       # 当前 step_years/test_years 均以年为单位
  train_min_years: 2         # 初始训练窗口（年）
  step_years: 1              # 扩展步长（年）
  test_years: 1              # 测试窗口（年）

# 模型
models:
  cross_section:             # 横截面回归
    enabled: true
    method: 'ols'            # ols | wls
  sort_portfolio:            # 分组组合
    enabled: true
    n_groups: 5
    weighting: 'equal'       # equal | cap_weight
  elastic_net:               # Elastic Net
    enabled: true
    alpha_grid: [0.001, 0.01, 0.05, 0.1]
    l1_ratio_grid: [0.1, 0.3, 0.5, 0.7]
  lightgbm:                  # LightGBM
    enabled: true
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    reg_alpha: 0.1
    reg_lambda: 0.1
  deep:                      # 深度学习因子模型（PyTorch MLP + Optuna HPO）
    enabled: true
    hidden_dims: [64, 32]
    dropout: 0.2
    lr: 0.001
    weight_decay: 0.0001
    epochs: 60
    batch_size: 512
    hpo_trials: 0            # 默认关闭；需要时通过 --hpo N 显式开启

# 评估
evaluation:
  ic_methods: ['pearson', 'spearman']    # 计算 IC 与 RankIC
  deciles: 5
  cost_scenarios_bps: [0, 10, 20, 30]    # 单边交易成本（基点）
  robustness:
    by_cap: true          # 按市值分桶
    by_industry: true     # 按行业分桶
    by_regime: true       # 按市场阶段（牛/熊）
  regime:
    bull_threshold: 0.20  # 中证全指 12 月滚动涨幅 > 20% 视为牛市

# 输出
output:
  log_dir: 'outputs/logs'
  result_dir: 'outputs/results'
  figure_dir: 'outputs/figures'
  save_format: ['parquet', 'csv']

# 随机种子
random_seed: 42

# 可视化
visualization:
  style: 'seaborn-v0_8-whitegrid'
  palette: 'Set2'
  fig_dir: 'outputs/figures'

# 服务化（FastAPI）
service:
  host: '0.0.0.0'
  port: 8000
  results_dir: 'outputs/results'   # 预计算结果 JSON 目录
  reload: false
