services:
  factorlab:
    build:
      context: .
      dockerfile: Dockerfile
    image: factorlab:0.2.0
    container_name: factorlab
    ports:
      - "8000:8000"
    environment:
      - FACTORLAB_NATIVE_LGB=1
    volumes:
      # 命名卷保留生成结果，并兼容镜像内的非 root 服务用户。
      - factorlab-outputs:/app/outputs
    restart: unless-stopped

volumes:
  factorlab-outputs:
