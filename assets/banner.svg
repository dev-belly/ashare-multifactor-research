<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lineUp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="lineB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="lineC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- 左侧文字 -->
  <text x="56" y="120" fill="#f8fafc" font-size="68" font-weight="800" letter-spacing="1">FactorLab</text>
  <text x="58" y="162" fill="#94a3b8" font-size="22" font-weight="500">A股多因子研究与样本外回测平台</text>
  <text x="58" y="196" fill="#64748b" font-size="18" font-weight="400">A-share Multi-Factor Research &amp; Out-of-Sample Backtesting</text>

  <!-- 标签 -->
  <g font-size="15" font-weight="600">
    <rect x="58" y="226" rx="14" ry="14" width="120" height="32" fill="#1e293b" stroke="#334155"/>
    <text x="118" y="247" fill="#f97316" text-anchor="middle">PyTorch</text>
    <rect x="190" y="226" rx="14" ry="14" width="120" height="32" fill="#1e293b" stroke="#334155"/>
    <text x="250" y="247" fill="#22d3ee" text-anchor="middle">Optuna</text>
    <rect x="322" y="226" rx="14" ry="14" width="120" height="32" fill="#1e293b" stroke="#334155"/>
    <text x="382" y="247" fill="#3b82f6" text-anchor="middle">FastAPI</text>
    <rect x="454" y="226" rx="14" ry="14" width="120" height="32" fill="#1e293b" stroke="#334155"/>
    <text x="514" y="247" fill="#a78bfa" text-anchor="middle">React</text>
  </g>

  <text x="58" y="312" fill="#e2e8f0" font-size="17" font-weight="500">严格 OOS 验证 · 16 因子 5 大类 · 深度学习因子 + HPO · 一键研究报告 &amp; 实时仪表盘</text>

  <!-- 右侧：净值曲线 -->
  <g transform="translate(720,60)">
    <rect x="0" y="0" width="440" height="280" rx="16" fill="#0b1224" stroke="#1e293b"/>
    <!-- 网格 -->
    <g stroke="#1e293b" stroke-width="1">
      <line x1="20" y1="40" x2="420" y2="40"/>
      <line x1="20" y1="100" x2="420" y2="100"/>
      <line x1="20" y1="160" x2="420" y2="160"/>
      <line x1="20" y1="220" x2="420" y2="220"/>
      <line x1="20" y1="40" x2="20" y2="240"/>
      <line x1="420" y1="40" x2="420" y2="240"/>
    </g>
    <!-- 曲线 A（红，上行） -->
    <polyline fill="none" stroke="url(#lineUp)" stroke-width="3" points="20,220 70,205 120,188 170,170 220,150 270,128 320,104 370,78 420,52"/>
    <!-- 曲线 B（蓝） -->
    <polyline fill="none" stroke="url(#lineB)" stroke-width="2.5" points="20,222 70,212 120,200 170,186 220,172 270,156 320,138 370,118 420,98"/>
    <!-- 曲线 C（紫） -->
    <polyline fill="none" stroke="url(#lineC)" stroke-width="2" points="20,224 70,218 120,210 170,200 220,190 270,178 320,164 370,150 420,134"/>
    <!-- 基准虚线 -->
    <polyline fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 5" points="20,200 420,200"/>
    <text x="430" y="205" fill="#64748b" font-size="12">benchmark</text>
    <text x="24" y="34" fill="#94a3b8" font-size="13" font-weight="600">模型样本外净值 (OOS NAV)</text>
  </g>

  <!-- 右下：因子衰减热力图小图 -->
  <g transform="translate(720,350)">
    <rect x="0" y="0" width="440" height="36" rx="8" fill="#0b1224" stroke="#1e293b"/>
    <g>
      <rect x="10"  y="8" width="34" height="20" fill="#7f1d1d"/>
      <rect x="48"  y="8" width="34" height="20" fill="#9a3412"/>
      <rect x="86"  y="8" width="34" height="20" fill="#b45309"/>
      <rect x="124" y="8" width="34" height="20" fill="#a16207"/>
      <rect x="162" y="8" width="34" height="20" fill="#4d7c0f"/>
      <rect x="200" y="8" width="34" height="20" fill="#15803d"/>
      <rect x="238" y="8" width="34" height="20" fill="#166534"/>
      <rect x="276" y="8" width="34" height="20" fill="#115e59"/>
      <rect x="314" y="8" width="34" height="20" fill="#0f766e"/>
      <rect x="352" y="8" width="34" height="20" fill="#155e75"/>
      <rect x="390" y="8" width="34" height="20" fill="#1e3a8a"/>
    </g>
    <text x="220" y="-4" fill="#64748b" font-size="11" text-anchor="middle">factor IC decay heatmap</text>
  </g>
</svg>
