<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FactorLab · A股多因子研究与样本外回测平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: { 950: "#060912", 900: "#0a0f1c", 850: "#0e1424", 800: "#121a2e", 700: "#1a2440", 600: "#243352", 500: "#324a6e" },
              bull: "#f43f5e",
              bear: "#10b981",
              cyan: "#38bdf8",
              violet: "#a78bfa",
              amber: "#f59e0b",
              emerald: "#34d399",
              pink: "#f472b6",
            },
            fontFamily: {
              sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "PingFang SC", "Microsoft YaHei", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
            },
            boxShadow: {
              glow: "0 0 0 1px rgba(148,163,184,0.08), 0 18px 50px -12px rgba(2,6,23,0.7)",
            },
          },
        },
      };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script>
      (function () {
        if (!window.echarts) return;
        echarts.registerTheme("factorlab", {
          color: ["#38bdf8", "#34d399", "#f59e0b", "#a78bfa", "#f472b6", "#22d3ee", "#fb7185"],
          backgroundColor: "transparent",
          textStyle: { color: "#cbd5e1", fontFamily: "Inter, -apple-system, sans-serif" },
          title: { textStyle: { color: "#e2e8f0", fontWeight: 600 } },
          legend: { textStyle: { color: "#94a3b8", fontSize: 12 }, inactiveColor: "#475569" },
          categoryAxis: {
            axisLine: { lineStyle: { color: "#2a3650" } },
            axisTick: { show: false },
            axisLabel: { color: "#64748b", fontSize: 11 },
            splitLine: { show: false, lineStyle: { color: "rgba(148,163,184,0.06)" } },
          },
          valueAxis: {
            axisLine: { show: false },
            axisTick: { show: false },
            axisLabel: { color: "#64748b", fontSize: 11 },
            splitLine: { lineStyle: { color: "rgba(148,163,184,0.08)" } },
          },
          timeAxis: {
            axisLine: { lineStyle: { color: "#2a3650" } },
            axisLabel: { color: "#64748b", fontSize: 11 },
            splitLine: { show: false },
          },
          tooltip: {
            backgroundColor: "rgba(10,15,28,0.94)",
            borderColor: "#2a3650",
            borderWidth: 1,
            textStyle: { color: "#e2e8f0", fontSize: 12 },
            extraCssText: "border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,0.55);backdrop-filter:blur(10px);padding:10px 14px;",
          },
        });
      })();
    </script>
    <style>
      :root { color-scheme: dark; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #e5edf7;
        background:
          radial-gradient(1100px 700px at 12% -8%, rgba(56, 189, 248, 0.12), transparent 60%),
          radial-gradient(900px 600px at 92% 4%, rgba(167, 139, 250, 0.12), transparent 55%),
          radial-gradient(800px 800px at 60% 110%, rgba(16, 185, 129, 0.06), transparent 60%),
          linear-gradient(180deg, #080d18 0%, #060912 100%);
        background-attachment: fixed;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.035) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(circle at 50% 30%, black, transparent 80%);
        pointer-events: none;
        z-index: 0;
      }
      #root { position: relative; z-index: 1; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #233149; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: #324a6e; }
      .glass {
        border-radius: 1rem;
        border: 1px solid rgba(148, 163, 184, 0.1);
        background: linear-gradient(180deg, rgba(20, 28, 48, 0.72), rgba(12, 18, 32, 0.62));
        backdrop-filter: blur(14px);
        box-shadow: 0 1px 0 0 rgba(255, 255, 255, 0.04) inset, 0 20px 50px -18px rgba(2, 6, 23, 0.7);
      }
      .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      .pill { display: inline-flex; align-items: center; gap: 0.4rem; border-radius: 9999px; border: 1px solid rgba(148,163,184,0.16); padding: 0.25rem 0.7rem; font-size: 0.72rem; color: #cbd5e1; }
      .btn-primary {
        border-radius: 0.7rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #38bdf8, #6366f1);
        box-shadow: 0 8px 24px -8px rgba(99, 102, 241, 0.6), 0 0 0 1px rgba(255,255,255,0.06) inset;
        transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }
      .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 12px 30px -8px rgba(99,102,241,0.7); }
      .btn-primary:active { transform: translateY(0); }
      .seg {
        display: inline-flex; padding: 0.28rem; gap: 0.2rem; border-radius: 0.85rem;
        background: rgba(12, 18, 32, 0.6); border: 1px solid rgba(148,163,184,0.1); backdrop-filter: blur(10px);
      }
      .seg button { border-radius: 0.6rem; padding: 0.4rem 0.95rem; font-size: 0.82rem; font-weight: 500; color: #94a3b8; transition: all 0.18s ease; }
      .seg button:hover { color: #e2e8f0; }
      .seg button.active {
        color: #fff;
        background: linear-gradient(135deg, rgba(56,189,248,0.22), rgba(99,102,241,0.22));
        box-shadow: 0 0 0 1px rgba(56,189,248,0.35) inset, 0 6px 18px -8px rgba(56,189,248,0.5);
      }
      .card-hover { transition: transform 0.18s ease, border-color 0.2s ease, box-shadow 0.2s ease; }
      .card-hover:hover { transform: translateY(-2px); border-color: rgba(56,189,248,0.3); box-shadow: 0 24px 60px -20px rgba(2,6,23,0.85); }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .fade-up { animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
      .skeleton { background: linear-gradient(90deg, rgba(148,163,184,0.06) 25%, rgba(148,163,184,0.14) 37%, rgba(148,163,184,0.06) 63%); background-size: 800px 100%; animation: shimmer 1.4s infinite linear; border-radius: 0.6rem; }
      .grad-text { background: linear-gradient(135deg, #38bdf8, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="app.js"></script>
  </body>
</html>
